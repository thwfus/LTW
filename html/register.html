<body>
    <div class="login-layout">
        <div class="login-media animate__animated animate__fadeIn">
            <img src="https://images.pexels.com/photos/27164972/pexels-photo-27164972.jpeg?auto=compress&cs=tinysrgb&w=1500" alt="Atelier Interior">
            <div class="login-media-overlay"></div>
            <div class="login-quote">
                <h2 class="section-title">Join the Atelier</h2>
                <p class="section-content">Stories of craftsmanship, interior inspiration, and studio updates. Create your curated collection.</p>
            </div>
        </div>

        <div class="login-form-side">
            <div class="login-form-container animate__animated animate__fadeInRight">
                <header class="login-header">
                    <a href="../task1/index.php" class="login-logo-link">

                    <p class="section-content">Please fill in your details to register.</p>

                        <input type="text" name="fullname" placeholder="John Doe" class="login-input" required />

                    <div class="input-group">

                        <input type="email" name="email" placeholder="mail@example.com" class="login-input" required />

                        <label class="section-content">Confirm Password</label>
                        <input type="password" name="confirm_password" placeholder="••••••••" class="login-input" required />
                    </div>

                    <button type="submit" name="register" class="btn btn-primary btn-lg login-submit">
                        Register Now
                    </button>
                </form>

                <footer class="login-footer">
                    <p class="section-content">Already have an account? 
                        <a href="../html/login.html" class="join-link">Log in here</a>
